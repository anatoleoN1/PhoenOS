set timeout=0
set default=0

# Résolution demandée au firmware (UEFI : GOP ; BIOS : VBE). PhoenOS affiche sa console 80x25 en graphique,
# et retombe sur le texte VGA si aucun mode graphique n'est fourni.
set gfxmode=1280x720x32,1024x768x32,800x600x32,auto
set gfxpayload=keep
insmod all_video

menuentry "PhoenOS" {
    multiboot2 /boot/phoenos.bin
    module2 /boot/initrd.tar
    boot
}

# 0.12.0 : autres resolutions (le menu est cache : maintenir Maj ou Echap pendant le demarrage du GRUB pour le voir).
# Sous QEMU avec la carte VGA standard, la commande "mode 1920x1080" change la resolution sans redemarrer.
menuentry "PhoenOS - 1920x1080" {
    set gfxpayload=1920x1080x32,1280x720x32,auto
    multiboot2 /boot/phoenos.bin
    module2 /boot/initrd.tar
    boot
}
menuentry "PhoenOS - 1280x720" {
    set gfxpayload=1280x720x32,1024x768x32,auto
    multiboot2 /boot/phoenos.bin
    module2 /boot/initrd.tar
    boot
}
menuentry "PhoenOS - 1024x768" {
    set gfxpayload=1024x768x32,800x600x32,auto
    multiboot2 /boot/phoenos.bin
    module2 /boot/initrd.tar
    boot
}
menuentry "PhoenOS - 800x600" {
    set gfxpayload=800x600x32,auto
    multiboot2 /boot/phoenos.bin
    module2 /boot/initrd.tar
    boot
}
